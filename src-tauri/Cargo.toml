[package]
name = "securekey"
version = "0.1.0"
description = "Gestionnaire de fichiers chiffré portable"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[lib]
name = "securekey"
path = "src/lib.rs"

[[bin]]
name = "securekey"
path = "src/main.rs"

[dependencies]
aead = { version = "=0.6.1", features = ["alloc"] }
aead-stream = { version = "=0.6.0", features = ["alloc"] }
argon2 = { version = "=0.6.0", features = ["parallel"] }
chacha20poly1305 = "=0.11.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "=2.6.1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
