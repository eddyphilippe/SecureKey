name: portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: macos-latest
            name: mac-intel
          - os: ubuntu-24.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dépendances Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Installer le frontend
        run: npm ci
      - name: Compiler
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "mac" ]; then
            npm run tauri build -- --bundles app
          elif [ "${{ matrix.name }}" = "mac-intel" ]; then
            rustup target add x86_64-apple-darwin
            npm run tauri build -- --target x86_64-apple-darwin --bundles app
          elif [ "${{ matrix.name }}" = "linux" ]; then
            npm run tauri build -- --bundles appimage
          else
            npm run tauri build -- --no-bundle
          fi
      - name: Préparer le fichier de cette version
        shell: bash
        run: |
          mkdir -p dist-upload
          if [ -d src-tauri/target/release/bundle/macos/NomadVault.app ]; then
            codesign --force --deep --sign - src-tauri/target/release/bundle/macos/NomadVault.app
            ditto -c -k --keepParent src-tauri/target/release/bundle/macos/NomadVault.app dist-upload/NomadVault-mac.zip
          fi
          if [ -d src-tauri/target/x86_64-apple-darwin/release/bundle/macos/NomadVault.app ]; then
            codesign --force --deep --sign - src-tauri/target/x86_64-apple-darwin/release/bundle/macos/NomadVault.app
            ditto -c -k --keepParent src-tauri/target/x86_64-apple-darwin/release/bundle/macos/NomadVault.app dist-upload/NomadVault-intel.zip
          fi
          exe=$(find src-tauri/target/release -maxdepth 1 \( -name 'NomadVault.exe' -o -name 'securekey.exe' \) | head -n 1)
          if [ -n "$exe" ]; then
            cp "$exe" dist-upload/NomadVault.exe
          fi
          appimage=$(find src-tauri/target/release/bundle -name '*.AppImage' 2>/dev/null | head -n 1 || true)
          if [ -n "$appimage" ]; then
            cp "$appimage" dist-upload/NomadVault
            chmod +x dist-upload/NomadVault
          elif [ -f src-tauri/target/release/NomadVault ]; then
            cp src-tauri/target/release/NomadVault dist-upload/NomadVault
            chmod +x dist-upload/NomadVault
          fi
          find dist-upload -type f -o -type d | sort
      - uses: actions/upload-artifact@v4
        with:
          name: securekey-${{ matrix.name }}
          path: dist-upload/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: securekey-*
          path: parts
      - name: Réunir le dossier de la clé
        run: |
          mkdir -p NomadVault/Mac NomadVault/Windows NomadVault/Linux NomadVault/Vault/objects
          unzip parts/securekey-mac/NomadVault-mac.zip -d NomadVault/Mac
          unzip parts/securekey-mac-intel/NomadVault-intel.zip -d /tmp/securekey-intel
          mv "/tmp/securekey-intel/NomadVault.app" "NomadVault/Mac/NomadVault Intel.app"
          cp parts/securekey-windows/NomadVault.exe NomadVault/Windows/NomadVault.exe
          cp parts/securekey-linux/NomadVault NomadVault/Linux/NomadVault
          chmod +x NomadVault/Linux/NomadVault
          cp packaging/README.txt NomadVault/README.txt
          zip -r NomadVault.zip NomadVault
      - uses: actions/upload-artifact@v4
        with:
          name: NomadVault
          path: NomadVault.zip
      # Le zip public est publié depuis un Mac après la signature Developer ID.
      # Cet ordinateur de construction n'a pas ce certificat : publier ici
      # remplacerait les applications Mac par des copies que macOS refuse.
